name: Kintsugi CI

# Pull requests only: nothing runs on pushes to `main`.
on:
  pull_request:
    branches:
      - main

# Least privilege: no job needs to write anything.
permissions:
  contents: read

# A new push to the same pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-format:
    name: Check Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    needs: check-format
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # `ai` and `cli` link LibTorch and have their own job, so this one needs no download.
      - name: Run Clippy
        run: cargo clippy --workspace --exclude ai --exclude cli --all-targets --locked -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --exclude ai --exclude cli --locked
